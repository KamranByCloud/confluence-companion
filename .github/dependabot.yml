version: 2

updates:
  # Runtime and build dependencies.
  #
  # Only minor and patch updates are grouped. A major update is deliberately
  # left ungrouped so it arrives as its own pull request with its own title.
  # The first grouped run hid a TypeScript 5 -> 7 jump inside "the development
  # group with 2 updates", which needed a tsconfig change to build at all.
  # A major has to be visible before it is reviewed.
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      production:
        dependency-type: production
        update-types: ["minor", "patch"]
      development:
        dependency-type: development
        update-types: ["minor", "patch"]

  # Keeps the actions used by the CI workflow current. Same rule: majors alone.
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
    groups:
      actions:
        update-types: ["minor", "patch"]
